snapshot: nightly-2026-10-19
compiler: ghc-9.14.1
packages:
- .
system-ghc: true
install-ghc: false
# Component-level -j settings live in package.yaml: the library and tests build
# in parallel, while the small executable avoids a GHC/Rosetta linking deadlock.
# -A128M sizes each capability's nursery; -c bounds old-generation memory.
ghc-options:
  "$targets": +RTS -A128M -n4m -c -RTS
