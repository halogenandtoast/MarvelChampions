name: MarvelChampions
language: GHC2021

dependencies:
- base >= 4.7 && < 5
- MonadRandom
- text
- exceptions
- lens
- extra
- hashable
- mtl
- uuid
- vector
- template-haskell
- unordered-containers
- aeson
- aeson-diff
- aeson-casing
- random-shuffle

default-extensions:
- BlockArguments
- DefaultSignatures
- DeriveAnyClass
- DeriveGeneric
- DerivingStrategies
- ExistentialQuantification
- FlexibleContexts
- FlexibleInstances
- FunctionalDependencies
- GADTs
- GeneralizedNewtypeDeriving
- ImportQualifiedPost
- KindSignatures
- LambdaCase
- MultiParamTypeClasses
- NoImplicitPrelude
- OverloadedStrings
- RankNTypes
- RecordWildCards
- ScopedTypeVariables
- StandaloneDeriving
- TupleSections
- TypeApplications
- TypeFamilies
- TypeOperators
- UndecidableInstances
- ViewPatterns
- QuantifiedConstraints
- NoPolyKinds

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wredundant-constraints
- -Wno-name-shadowing
- -Wno-orphans

library:
  source-dirs: src

tests:
  MarvelChampions-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - MarvelChampions
