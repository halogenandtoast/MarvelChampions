name: MarvelChampions
language: GHC2021

dependencies:
- base >= 4.7 && < 5
- safe
- MonadRandom
- text
- exceptions
- lens
- extra
- hashable
- mtl
- containers
- random
- splitmix
- uuid
- vector
- template-haskell
- unordered-containers
- aeson
- aeson-diff
- aeson-casing
- random-shuffle

default-extensions:
- BlockArguments
- DefaultSignatures
- DeriveAnyClass
- DeriveGeneric
- DerivingStrategies
- ExistentialQuantification
- FlexibleContexts
- FlexibleInstances
- FunctionalDependencies
- GADTs
- GeneralizedNewtypeDeriving
- ImportQualifiedPost
- KindSignatures
- LambdaCase
- MultiParamTypeClasses
- NoImplicitPrelude
- OverloadedStrings
- RankNTypes
- RecordWildCards
- ScopedTypeVariables
- StandaloneDeriving
- TupleSections
- TypeApplications
- TypeFamilies
- TypeOperators
- UndecidableInstances
- ViewPatterns
- QuantifiedConstraints
- NoPolyKinds
- MultiWayIf
- OverloadedRecordDot

ghc-options:
- -Werror
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wredundant-constraints
- -Wno-name-shadowing
- -Wno-orphans

library:
  source-dirs: src
  ghc-options:
  - -j

executables:
  marvel-champions:
    main: Main.hs
    source-dirs: app
    ghc-options:
    # Parallel GHC gets stuck after its C subprocess exits when linking under
    # Rosetta. Keep the engine parallel; these nine API modules use one worker.
    - -j1
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - MarvelChampions
    - classy-prelude
    - aeson-diff
    - bcrypt
    - bytestring
    - jose
    - monad-time
    - persistent
    - persistent-postgresql
    - time
    - yesod-core
    - yesod-persistent
    - yesod-websockets
    - monad-logger
    - http-client
    - http-client-tls
    - http-types
    - crypton
    - ram
    - base16-bytestring

tests:
  MarvelChampions-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -j
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - MarvelChampions
    - hspec
    - hspec-expectations-lifted
    - random
    - bytestring
    build-tools:
    - hspec-discover
