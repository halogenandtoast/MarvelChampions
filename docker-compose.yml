# Everything for a local game: postgres, the API, and the client (which serves the card
# images it was built with, and proxies /api to the API).
services:
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marvelchampions
    volumes:
      - pgdata:/var/lib/postgresql/data
  marvel-backend:
    build: .
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/marvelchampions
      - JWT_SECRET=local-docker-secret-change-me-at-least-32-bytes
    depends_on:
      - db
  frontend:
    build: frontend
    ports:
      - "3000:80"
    depends_on:
      - marvel-backend
volumes:
  pgdata:
